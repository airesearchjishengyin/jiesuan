<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>借算 · 控制台</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel2: #1a2030;
    --border: #232b3d; --text: #e6e9f0; --muted: #8b93a7;
    --green: #34d399; --red: #f87171; --amber: #fbbf24; --blue: #60a5fa;
    --accent: #7c9cff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    min-height: 100vh; padding: 24px;
  }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 18px; min-width: 120px;
  }
  .stat .v { font-size: 24px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .v.green { color: var(--green); } .v.blue { color: var(--blue); } .v.amber { color: var(--amber); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    position: relative; transition: border-color .2s;
  }
  .card.off { opacity: .55; }
  .card .glow {
    position: absolute; top: 14px; right: 16px;
    width: 10px; height: 10px; border-radius: 50%;
  }
  .glow.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .glow.off-manual { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .glow.off-dead { background: var(--red); box-shadow: 0 0 10px var(--red); }
  .card h2 { font-size: 16px; font-weight: 650; margin-bottom: 2px; }
  .card .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 14px; }
  .tier-badge {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 6px;
    background: #223; border: 1px solid var(--border); color: var(--accent);
    margin-left: 8px; vertical-align: middle;
  }
  .bar { height: 6px; background: #0d1119; border-radius: 3px; overflow: hidden; margin: 4px 0 12px; }
  .bar > div { height: 100%; border-radius: 3px; background: var(--blue); transition: width .4s; }
  .row { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; }
  .row .k { color: var(--muted); }
  .models { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 14px; }
  .chip {
    font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
    background: #1b2437; border: 1px solid var(--border); color: #b9c2d8;
  }
  .chip.loaded { background: #14301f; border-color: #1f5c38; color: var(--green); }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    cursor: pointer; transition: all .15s;
  }
  button:hover { border-color: var(--accent); }
  button.go { background: #14301f; border-color: #1f5c38; color: var(--green); }
  button.stop { background: #381a1a; border-color: #6b2727; color: var(--red); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  footer { margin-top: 26px; color: var(--muted); font-size: 11px; text-align: center; }
  .pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>
<header>
  <h1>借算 <span>·</span> 控制台</h1>
  <div class="sub" id="refreshed">connecting…</div>
</header>

<div class="stats">
  <div class="stat"><div class="v green" id="s-online">–</div><div class="k">在线节点</div></div>
  <div class="stat"><div class="v" id="s-total">–</div><div class="k">注册节点</div></div>
  <div class="stat"><div class="v blue" id="s-loaded">–</div><div class="k">驻留模型</div></div>
  <div class="stat"><div class="v amber" id="s-pending">–</div><div class="k">排队请求</div></div>
</div>

<div class="grid" id="cards"></div>
<footer>借算 jiesuan · edge inference pool · <span id="err"></span></footer>

<script>
const state = {};

async function refresh() {
  try {
    const r = await fetch('/admin/nodes');
    const d = await r.json();
    render(d);
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = '网关不可达 — ' + new Date().toLocaleTimeString();
  }
}

function render(d) {
  document.getElementById('refreshed').textContent =
    '刷新于 ' + new Date().toLocaleTimeString();
  const nodes = d.nodes;
  const online = nodes.filter(n => n.online).length;
  const loaded = new Set(nodes.filter(n => n.online).flatMap(n => n.loaded));
  document.getElementById('s-online').textContent = online;
  document.getElementById('s-total').textContent = nodes.length;
  document.getElementById('s-loaded').textContent = loaded.size;
  document.getElementById('s-pending').textContent =
    nodes.reduce((a, n) => a + n.pending, 0);

  document.getElementById('cards').innerHTML = nodes.map(n => {
    const glowCls = n.online ? 'on' : (n.manual_offline ? 'off-manual' : 'off-dead');
    const statusText = n.online ? '在线服务中'
                     : (n.manual_offline ? '手动下线' : '失联/睡眠');
    const capPct = (n.total_ram_gb ? Math.min(100, (n.used_ram_gb / n.total_ram_gb) * 100) : 0).toFixed(0);
    const models = (n.models_disk || []).map(m => {
      const isLoaded = (n.loaded || []).includes(m);
      return `<span class="chip ${isLoaded && n.online ? 'loaded' : ''}">${m}${isLoaded && n.online ? ' ●' : ''}</span>`;
    }).join('');
    const busyBtn = n.online
      ? `<button class="stop" onclick="ctl('${n.name}','offline')">下线摘流</button>`
      : `<button class="go" onclick="ctl('${n.name}','online')">上线恢复</button>`;
    return `
    <div class="card ${n.online ? '' : 'off'}">
      <div class="glow ${glowCls}"></div>
      <h2>${n.name}<span class="tier-badge">${n.kind}</span></h2>
      <div class="meta">${n.os || ''} ${n.arch || ''} · ${statusText}</div>
      ${n.total_ram_gb ? `
      <div class="row"><span class="k">内存占用</span><span>${n.used_ram_gb} / ${n.total_ram_gb} GB (${capPct}%)</span></div>
      <div class="bar"><div style="width:${capPct}%"></div></div>
      <div class="row"><span class="k">可承载余量</span><span>${n.capacity_gb ?? '–'} GB</span></div>` : ''}
      <div class="row"><span class="k">排队请求</span><span>${n.pending}</span></div>
      <div class="row"><span class="k">用户状态</span><span>${n.idle === null ? '–' : (n.idle ? '🟢 闲置' : '🟠 使用中')}</span></div>
      <div class="models">${models}</div>
      <div class="actions">${busyBtn}</div>
    </div>`;
  }).join('');
}

async function ctl(name, action) {
  state[name] = 'pending';
  try {
    await fetch(`/admin/node/${name}/${action}`, { method: 'POST' });
  } finally { refresh(); }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
