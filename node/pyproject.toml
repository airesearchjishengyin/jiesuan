[project]
name = "jiesuan-node"
version = "0.1.0"
description = "借算 节点端 — 把本机推理引擎接入借算网络"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "yarl>=1.9"]

[project.scripts]
jiesuan-node = "jiesuan_node.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jiesuan_node*"]
